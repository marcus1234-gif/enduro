var cur = currentWeek();
var sel = cur;
var tab = "home";
var openDays = {}; // key "week:index" -> bool

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ─── RENDER: TIMELINE ───────────────────────────────────────────────────────
function renderTimeline() {
  var cells = "";
  for (var w = 1; w <= TOTAL_WEEKS; w++) {
    var p = ph(w);
    var race = RACES.find(function(r){ return r.week === w; });
    var isSel = (w === sel), isCur = (w === cur);
    var border = isCur ? ("2px solid " + p.color) : isSel ? ("2px solid " + p.color) : ("1px solid " + p.color + "45");
    var bg = isSel ? p.color : (p.color + "28");
    var col = isSel ? "#fff" : p.color;
    cells +=
      '<div class="tl-cell" data-action="selweek" data-week="' + w + '">' +
        '<div class="tl-num" style="background:' + bg + ';border:' + border + ';color:' + col + '">' + w + '</div>' +
        '<div class="tl-dot" style="background:' + (race ? race.color : "transparent") + '"></div>' +
      '</div>';
  }
  var bands = "";
  PHASES.forEach(function(p){
    var n = p.weeks.length;
    var width = n * 26 + (n - 1) * 3;   // match week-cell widths + gaps so bands align
    var active = p.weeks.indexOf(cur) !== -1;
    bands +=
      '<div class="tl-band" data-action="selweek" data-week="' + p.weeks[0] + '" ' +
        'style="width:' + width + 'px;background:' + p.color + (active ? "33" : "1c") + ';border:1px solid ' + p.color + (active ? "" : "55") + ';color:' + (active ? "#f0f0ec" : p.color) + '">' +
        '<span>' + esc(p.name) + '</span>' +
      '</div>';
  });
  document.getElementById("timeline").innerHTML =
    '<div class="tl-row">' + cells + '</div><div class="tl-bandrow">' + bands + '</div>';
}

function dayCardHtml(w, di, day, checked) {
  var wt = WT[day.t] || WT.rest;
  var isEvent = (day.t === "race" || day.t === "watch");
  var open = !!openDays[w + ":" + di];
  var checkbox = "";
  if (!isEvent) {
    checkbox =
      '<div class="dc-check" data-action="check-day" data-i="' + di + '" ' +
      'style="border:1.5px solid ' + (checked ? wt.border : "#3a3a3d") + ';background:' + (checked ? wt.border : "transparent") + '">' +
      (checked ? '<span class="tick" style="font-size:10px">✓</span>' : "") + '</div>';
  }
  var titleStyle = "color:" + (checked ? "#555" : "#d4d4dc") + ";text-decoration:" + (checked ? "line-through" : "none");
  var body = "";
  if (open) {
    var lis = "";
    day.b.forEach(function(item){
      lis += '<li class="dc-li"><span style="color:' + wt.border + ';flex-shrink:0">›</span>' + esc(item) + '</li>';
    });
    var note = day.n
      ? '<div class="dc-note" style="background:' + wt.bg + ';border-left:2px solid ' + wt.border + '"><p>' + esc(day.n) + '</p></div>'
      : "";
    body = '<div class="dc-body"><ul class="dc-list">' + lis + '</ul>' + note + '</div>';
  }
  return '<div class="daycard" style="border-color:' + (open ? wt.border : "#242428") + '">' +
    '<div class="dc-head" data-action="toggle-day" data-key="' + w + ':' + di + '">' +
      checkbox +
      '<span class="dc-dayname">' + DAYS[di] + '</span>' +
      '<span class="dc-badge" style="color:' + wt.border + ';background:' + wt.bg + '">' + wt.badge + '</span>' +
      '<span class="dc-title" style="' + titleStyle + '">' + esc(day.h) + '</span>' +
      '<span class="dc-caret">' + (open ? "▲" : "▼") + '</span>' +
    '</div>' + body + '</div>';
}

function renderWeekView() {

      '<div style="height:100%;width:' + pct + '%;background:' + phase.color + ';border-radius:2px;transition:width .3s"></div>' +

      '<span style="font-size:10px;font-weight:700;color:' + race.color + ';letter-spacing:.1em">' + race.type + ' · THIS WEEK</span>' +

// ─── PROGRESS STATS ─────────────────────────────────────────────────────────
function computeStats() {
  var cats = {
    mob:  { label:"Mobility",  color:"#6366F1", done:0, total:0 },
    str:  { label:"Strength",  color:"#3B82F6", done:0, total:0 },
    z2:   { label:"Zone 2",    color:"#10B981", done:0, total:0 },
    hiit: { label:"HIIT",      color:"#F59E0B", done:0, total:0 },
    ride: { label:"Riding",    color:"#F04E00", done:0, total:0 },
    rec:  { label:"Recovery",  color:"#6B7280", done:0, total:0 },
  };
  function bucket(t){ return t === "rest" ? "rec" : t; }
  var trainDone = 0, trainTotal = 0;
  for (var w = 1; w <= TOTAL_WEEKS; w++) {
    for (var d = 0; d < 7; d++) {
      var day = getDay(w, d);
      if (day.t === "race" || day.t === "watch") continue; // no checkbox on event days
      var b = bucket(day.t);
      if (!cats[b]) continue;
      cats[b].total++; trainTotal++;
      if (getS("d:" + w + ":" + d)) { cats[b].done++; trainDone++; }
    }
  }
  var skDone = 0, skTotal = 0;
  SKILLS.forEach(function(cat, ci){ cat.items.forEach(function(_, i){ skTotal++; if (getS("sk:" + ci + ":" + i)) skDone++; }); });
  var rpDone = 0, rpTotal = 0;
  RACES.forEach(function(r){ r.prep.forEach(function(_, i){ rpTotal++; if (getS("rp:" + r.week + ":" + i)) rpDone++; }); });
  return {
    cats: cats, order: ["mob","str","z2","hiit","ride","rec"],
    trainDone: trainDone, trainTotal: trainTotal,
    skDone: skDone, skTotal: skTotal,
    rpDone: rpDone, rpTotal: rpTotal,
    allDone: trainDone + skDone + rpDone,
    allTotal: trainTotal + skTotal + rpTotal,
  };
}
function pctOf(d, t){ return t ? Math.round(d / t * 100) : 0; }

function ringSvg(pct, color) {
  var r = 60, C = 2 * Math.PI * r;
  var off = C - (pct / 100) * C;
  return '<svg width="138" height="138" viewBox="0 0 132 132">' +
    '<circle cx="66" cy="66" r="60" fill="none" stroke="#242428" stroke-width="12"/>' +
    '<circle class="ring-fg" cx="66" cy="66" r="60" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" style="stroke-dashoffset:' + C.toFixed(1) + '" data-offset="' + off.toFixed(1) + '" transform="rotate(-90 66 66)"/>' +
    '<text x="66" y="61" text-anchor="middle" font-size="32" font-weight="800" fill="#f0f0ec" font-family="system-ui,sans-serif">' + pct + '%</text>' +
    '<text x="66" y="82" text-anchor="middle" font-size="10" fill="#666" font-family="monospace" letter-spacing="1">OVERALL</text>' +
  '</svg>';
}

function headline(pct) {
  if (pct >= 100) return "Every box checked. Go ride.";
  if (pct >= 80)  return "Final push — stay smooth.";
  if (pct >= 60)  return "Tamarack's coming into view.";
  if (pct >= 40)  return "Deep in the build now.";
  if (pct >= 20)  return "Momentum's building.";
  if (pct >= 1)   return "The base is forming.";
  return "Time to put in the work.";
}

        '<div class="nm"><span class="cd" style="background:' + c.color + '"></span>' + c.label +
          '<span style="font-size:10px;color:' + c.color + ';font-family:monospace;font-weight:700">' + p + '%</span></div>' +
        '<span class="ct">' + c.done + '/' + c.total + '</span>' +
      '</div>' +
      '<div class="bar"><div data-width="' + p + '" style="background:' + c.color + '"></div></div>' +
    '</div>';
  });

  html += '<div class="sec-label" style="margin-top:18px">Program Arc</div>';
  PHASES.forEach(function(p){
    var isActive = p.weeks.indexOf(cur) !== -1;
    var isDone = Math.max.apply(null, p.weeks) < cur;
    var pRaces = RACES.filter(function(r){ return p.weeks.indexOf(r.week) !== -1; });
    html += '<div data-action="selweek" data-week="' + p.weeks[0] + '" style="padding:12px;border-radius:10px;background:' + (isActive ? "#1e1e22" : "#151517") + ';border:1px solid ' + (isActive ? p.color : "#222226") + ';margin-bottom:8px;cursor:pointer;opacity:' + (isDone ? ".55" : "1") + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div style="width:9px;height:9px;border-radius:2px;background:' + p.color + '"></div>' +
          '<span style="font-size:13px;font-weight:700;color:' + (isActive ? "#f0f0ec" : "#777") + '">Phase ' + p.id + ': ' + esc(p.name) + '</span>' +
          (isDone ? '<span style="font-size:9px;color:#22C55E;font-family:monospace">DONE</span>' : "") +
          (isActive ? '<span style="font-size:9px;color:' + p.color + ';font-family:monospace">← YOU ARE HERE</span>' : "") +
        '</div>' +
        '<span style="font-size:10px;color:#444;font-family:monospace">Wk ' + p.weeks[0] + '–' + p.weeks[p.weeks.length - 1] + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:#555;font-style:italic;margin-bottom:' + (pRaces.length ? "7px" : "0") + '">' + esc(p.tagline) + '</div>';
    pRaces.forEach(function(r){
      html += '<div style="display:flex;align-items:center;gap:6px">' +
        '<div style="width:5px;height:5px;border-radius:50%;background:' + r.color + '"></div>' +
        '<span style="font-size:11px;font-weight:700;color:' + r.color + '">' + r.type + ': ' + esc(r.name) + '</span>' +
        '<span style="font-size:11px;color:#444">· ' + r.date + '</span>' +
      '</div>';
    });
    html += '</div>';
  });

  html += '<div class="install-tip">' +
    '<div class="t">Offline app</div>' +
    '<p>This runs entirely on your phone — no signal needed on the trail. Your checkboxes save to this device. To keep an icon handy, add it to your home screen from Safari.</p>' +
  '</div>';
  return html;
}

// ─── RENDER DISPATCH ────────────────────────────────────────────────────────
function renderView() {
  var el = document.getElementById("view");
  var html;
  if (tab === "home") html = renderHomeView();
  else if (tab === "week") html = renderWeekView();
  else if (tab === "skills") html = renderSkillsView();
  else if (tab === "races") html = renderRacesView();
  el.innerHTML = html;
  animate();
}

function animate() {
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var el = document.getElementById("view");
    if (!el) return;
    el.querySelectorAll(".ring-fg").forEach(function(c){
      c.style.strokeDashoffset = c.getAttribute("data-offset");
    });
    el.querySelectorAll(".bar > div[data-width]").forEach(function(b){
      b.style.width = b.getAttribute("data-width") + "%";
    });
  }); });
}

function renderAll() {
  renderTimeline();
  renderTabs();
  renderView();
}

// ─── EVENT DELEGATION ───────────────────────────────────────────────────────
document.addEventListener("click", function(e){
  var node = e.target;
  while (node && node !== document.body && !node.getAttribute("data-action")) {
    node = node.parentNode;
  }
  if (!node || node === document.body) return;
  var action = node.getAttribute("data-action");

  if (action === "tab") {
    tab = node.getAttribute("data-tab");
    renderTabs(); renderView();
  } else if (action === "selweek") {
    sel = parseInt(node.getAttribute("data-week"), 10);
    tab = "week";
    renderTimeline(); renderTabs(); renderView();
  } else if (action === "toggle-day") {
    var key = node.getAttribute("data-key");
    openDays[key] = !openDays[key];
    renderView();
  } else if (action === "check-day") {
    e.stopPropagation();
    var i = node.getAttribute("data-i");
    var k = "d:" + sel + ":" + i;
    setS(k, !getS(k));
    renderView();
  } else if (action === "check-skill" || action === "check-prep") {
    var sk = node.getAttribute("data-key");
    setS(sk, !getS(sk));
    renderView();
  }
});

// ─── SERVICE WORKER (offline copy onto the phone) ───────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}

// ─── INIT ───────────────────────────────────────────────────────────────────
renderAll();
</script>
