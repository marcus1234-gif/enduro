  .header { padding: 16px 16px 0; }

  .tl-num { width: 26px; height: 26px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-family: monospace; font-weight: 700; transition: all .15s; }
  .tl-dot { width: 5px; height: 5px; border-radius: 50%; }
  .tl-legend { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .tl-leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #555; font-family: monospace; }
  .tl-leg .sw { display: inline-block; width: 7px; height: 7px; border-radius: 2px; }
  .tl-leg .dotsw { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #EF4444; }
  .tabs { display: flex; gap: 2px; padding: 12px 16px 0; border-bottom: 1px solid #1e1e21; }
  .tab { padding: 7px 13px; border-radius: 7px 7px 0 0; border: none; cursor: pointer; font-size: 12px; font-weight: 600; background: transparent; color: #555; border-bottom: 2px solid transparent; }
  .tab.active { background: #1a1a1d; color: #f0f0ec; border-bottom: 2px solid #F04E00; }
  .view { padding: 16px; }

  .dc-check { width: 17px; height: 17px; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .dc-dayname { font-size: 11px; color: #444; font-family: monospace; width: 24px; flex-shrink: 0; }
  .dc-badge { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 2px 5px; flex-shrink: 0; letter-spacing: .05em; }
  .dc-title { font-size: 13px; font-weight: 600; flex: 1; line-height: 1.3; }
  .dc-caret { color: #333; font-size: 11px; }
  .dc-body { padding: 0 12px 12px; border-top: 1px solid #242428; }
  .dc-list { margin: 10px 0 0; padding: 0; list-style: none; }
  .dc-li { font-size: 12px; color: #8a8a92; margin-bottom: 5px; display: flex; gap: 8px; line-height: 1.45; }
  .dc-note { margin-top: 10px; padding: 8px 10px; border-radius: 0 6px 6px 0; }
  .dc-note p { margin: 0; font-size: 11px; color: #a0a0a8; line-height: 1.5; font-style: italic; }
  .tick { color: #fff; font-weight: 700; }
  .chk { border-radius: 3px; width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
  .chk .tick { font-size: 9px; }
  .row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 7px; cursor: pointer; }

];

var SKILLS = [
  { phase:1, cat:"Body Position",   items:["Attack position: elbows up, knees grip tank, weight centered over footpegs","Standing position: balls of feet on pegs, slight knee bend, loose arms","Two-finger clutch control — not whole-hand grip","Two-finger front brake technique (not whole-hand)","Smooth throttle: progressive roll-on/off, no snapping"] },
  { phase:1, cat:"Basic Technical", items:["Slow-speed balance: figure 8s and near-stationary straight balance","Log crossings: momentum commitment + weight shift rearward","Basic cornering: look through corner, body leads bike into lean","Rut navigation: look further ahead, relax arms, let bike move beneath you"] },
  { phase:2, cat:"Technical Terrain", items:["Rocky climbs: commit to momentum, clutch slip on steep technical pitches","Technical descents: weight back, two fingers covering brake, no death-grip","Switchbacks: wide entry → apex with inside peg weighted → wide exit","Loose over hard: keep front wheel light, weight rearward","Sidehill traversing: uphill peg weighted, eyes far ahead"] },
  { phase:2, cat:"Pace + Fitness",  items:["30 min sustained riding at race pace without arm pump shutting you down","Controlled breathing during effort: belly breaths on straight sections","Heart rate management: back off before redline, not after","Grip relaxation on low-risk sections to reset forearms mid-ride"] },
  { phase:3, cat:"Race Craft",      items:["Hare scramble row start: smooth launch, don't spin the rear wheel","First lap pacing: resist racing everyone off the line — find your own pace","Course marking: read arrows confidently, plan next gate while on current","Passing: announce yourself, wait for a safe section, clean pass only","Being passed: hold your line, let faster riders through cleanly"] },
  { phase:4, cat:"Race Refinement", items:["Identify your personal limiting factor (arms, lungs, or technique — be honest)","Adjust line selection based on traffic and fatigue level mid-race","Fuel and hydration timing: eat and drink before you feel you need to","Reading mid-race fatigue and compensating with better technique, not more effort"] },
  { phase:5, cat:"Peak Execution",  items:["Full mock race session: simulate the entire race day start to finish","Sustaining race pace for the full class duration (2 hrs)","Mental reset mid-race: if something goes wrong, refocus within 10 seconds","Consistent lap times: lap 3 within 10% of lap 1 is the target"] },
];

// ─── STATE ──────────────────────────────────────────────────────────────────
var cur = currentWeek();
var sel = cur;
var tab = "week";
var openDays = {}; // key "week:index" -> bool

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ─── RENDER: TIMELINE ───────────────────────────────────────────────────────
function renderTimeline() {
  var cells = "";
  for (var w = 1; w <= 20; w++) {
    var p = ph(w);
    var race = RACES.find(function(r){ return r.week === w; });
    var isSel = (w === sel), isCur = (w === cur);
    var border = isCur ? ("2px solid " + p.color) : isSel ? ("2px solid " + p.color) : ("1px solid " + p.color + "45");
    var bg = isSel ? p.color : (p.color + "28");
    var col = isSel ? "#fff" : p.color;
    cells +=
      '<div class="tl-cell" data-action="selweek" data-week="' + w + '">' +
        '<div class="tl-num" style="background:' + bg + ';border:' + border + ';color:' + col + '">' + w + '</div>' +
        '<div class="tl-dot" style="background:' + (race ? race.color : "transparent") + '"></div>' +
      '</div>';
  }
  var legend = "";
  PHASES.forEach(function(p){
    legend += '<span class="tl-leg"><span class="sw" style="background:' + p.color + '"></span>P' + p.id + ' ' + esc(p.name) + '</span>';
  });
  legend += '<span class="tl-leg"><span class="dotsw"></span>Race/Watch</span>';
  document.getElementById("timeline").innerHTML =
    '<div class="tl-row">' + cells + '</div><div class="tl-legend">' + legend + '</div>';
}

// ─── RENDER: TABS ───────────────────────────────────────────────────────────
function renderTabs() {
  var defs = [
    { id:"overview", label:"Overview" },
    { id:"week",     label:"Week " + sel },
    { id:"skills",   label:"Skills" },
    { id:"races",    label:"Races" },
  ];
  var html = "";
  defs.forEach(function(t){
    html += '<button class="tab' + (tab === t.id ? " active" : "") + '" data-action="tab" data-tab="' + t.id + '">' + esc(t.label) + '</button>';
  });
  document.getElementById("tabs").innerHTML = html;
}

// ─── RENDER: WEEK VIEW ──────────────────────────────────────────────────────
function dayCardHtml(w, di, day, checked) {
  var wt = WT[day.t] || WT.rest;
  var isEvent = (day.t === "race" || day.t === "watch");
  var open = !!openDays[w + ":" + di];
  var checkbox = "";
  if (!isEvent) {
    checkbox =
      '<div class="dc-check" data-action="check-day" data-i="' + di + '" ' +
      'style="border:1.5px solid ' + (checked ? wt.border : "#3a3a3d") + ';background:' + (checked ? wt.border : "transparent") + '">' +
      (checked ? '<span class="tick" style="font-size:10px">✓</span>' : "") + '</div>';
  }
  var titleStyle = "color:" + (checked ? "#555" : "#d4d4dc") + ";text-decoration:" + (checked ? "line-through" : "none");
  var body = "";
  if (open) {
    var lis = "";
    day.b.forEach(function(item){
      lis += '<li class="dc-li"><span style="color:' + wt.border + ';flex-shrink:0">›</span>' + esc(item) + '</li>';
    });
    var note = day.n
      ? '<div class="dc-note" style="background:' + wt.bg + ';border-left:2px solid ' + wt.border + '"><p>' + esc(day.n) + '</p></div>'
      : "";
    body = '<div class="dc-body"><ul class="dc-list">' + lis + '</ul>' + note + '</div>';
  }
  return '<div class="daycard" style="border-color:' + (open ? wt.border : "#242428") + '">' +
    '<div class="dc-head" data-action="toggle-day" data-key="' + w + ':' + di + '">' +
      checkbox +
      '<span class="dc-dayname">' + DAYS[di] + '</span>' +
      '<span class="dc-badge" style="color:' + wt.border + ';background:' + wt.bg + '">' + wt.badge + '</span>' +
      '<span class="dc-title" style="' + titleStyle + '">' + esc(day.h) + '</span>' +
      '<span class="dc-caret">' + (open ? "▲" : "▼") + '</span>' +
    '</div>' + body + '</div>';
}

function renderWeekView() {
  var phase = ph(sel);
  var race = RACES.find(function(r){ return r.week === sel; });
  var days = [];
  for (var i = 0; i < 7; i++) days.push(getDay(sel, i));
  function checked(i){ return getS("d:" + sel + ":" + i); }
  var trainDays = days.filter(function(d){ return d.t !== "race" && d.t !== "watch"; }).length;
  var doneCount = 0;
  for (var j = 0; j < 7; j++) if (checked(j)) doneCount++;
  var pct = trainDays ? (doneCount / trainDays * 100) : 0;

  var html = "";
  html += '<div style="margin-bottom:14px">' +
    '<div style="font-size:10px;font-weight:700;color:' + phase.color + ';text-transform:uppercase;letter-spacing:.12em;font-family:monospace;margin-bottom:3px">Week ' + sel + ' · Phase ' + phase.id + ': ' + esc(phase.name) + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<span style="font-size:12px;color:#555">' + WK_DATES[sel - 1] + '</span>' +
      '<span style="font-size:11px;color:' + (doneCount === trainDays ? "#22C55E" : "#555") + ';font-family:monospace">' + doneCount + '/' + trainDays + ' done</span>' +
    '</div>' +
    '<div style="height:3px;background:#242428;border-radius:2px;margin-top:6px">' +
      '<div style="height:100%;width:' + pct + '%;background:' + phase.color + ';border-radius:2px;transition:width .3s"></div>' +
    '</div></div>';

  if (race) {
    html += '<div style="padding:10px 12px;border-radius:8px;background:' + race.color + '14;border:1px solid ' + race.color + '45;margin-bottom:12px">' +
      '<span style="font-size:10px;font-weight:700;color:' + race.color + ';letter-spacing:.1em">' + race.type + ' · THIS WEEK</span>' +
      '<p style="margin:2px 0 0;font-size:13px;color:#d4d4dc;font-weight:600">' + esc(race.name) + ' · ' + race.date + '</p>' +
      '<p style="margin:2px 0 0;font-size:11px;color:#888">' + esc(race.loc) + ' · ' + esc(race.goal) + '</p>' +
    '</div>';
  }
  for (var k = 0; k < 7; k++) html += dayCardHtml(sel, k, days[k], checked(k));
  return html;
}

// ─── RENDER: SKILLS VIEW ────────────────────────────────────────────────────
function renderSkillsView() {
  var html = '<p style="font-size:12px;color:#555;margin-top:0;margin-bottom:14px;line-height:1.5">Check off each skill as you develop it on the bike. These track your progression toward mid-pack racing — work through each phase in order.</p>';
  SKILLS.forEach(function(cat, ci){
    var p = PHASES[cat.phase - 1];
    var doneCount = cat.items.filter(function(_, i){ return getS("sk:" + ci + ":" + i); }).length;
    html += '<div style="margin-bottom:12px;padding:12px;border-radius:10px;background:#1a1a1d;border:1px solid #252528">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
        '<div style="display:flex;align-items:center;gap:7px">' +
          '<div style="width:8px;height:8px;border-radius:2px;background:' + p.color + '"></div>' +
          '<span style="font-size:12px;font-weight:700;color:#d4d4dc">' + esc(cat.cat) + '</span>' +
          '<span style="font-size:9px;color:' + p.color + ';font-family:monospace">Phase ' + cat.phase + '</span>' +
        '</div>' +
        '<span style="font-size:10px;color:' + (doneCount === cat.items.length ? "#22C55E" : "#444") + ';font-family:monospace">' + doneCount + '/' + cat.items.length + '</span>' +
      '</div>';
    cat.items.forEach(function(skill, i){
      var done = getS("sk:" + ci + ":" + i);
      html += '<div class="row" data-action="check-skill" data-key="sk:' + ci + ':' + i + '">' +
        '<div class="chk" style="border:1.5px solid ' + (done ? p.color : "#353538") + ';background:' + (done ? p.color : "transparent") + '">' +
          (done ? '<span class="tick">✓</span>' : "") + '</div>' +
        '<span class="lbl" style="color:' + (done ? "#444" : "#8a8a92") + ';text-decoration:' + (done ? "line-through" : "none") + '">' + esc(skill) + '</span>' +
      '</div>';
    });
    html += '</div>';
  });
  return html;
}

// ─── RENDER: RACES VIEW ─────────────────────────────────────────────────────
function renderRacesView() {
  var html = "";
  RACES.forEach(function(r){
    var doneCount = r.prep.filter(function(_, i){ return getS("rp:" + r.week + ":" + i); }).length;
    html += '<div style="margin-bottom:14px;border-radius:12px;background:#1a1a1d;border:1px solid ' + r.color + '35;overflow:hidden">' +
      '<div style="padding:12px 14px;background:' + r.color + '10;border-bottom:1px solid ' + r.color + '25">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-size:10px;font-weight:700;color:' + r.color + ';letter-spacing:.1em;font-family:monospace">' + r.type + ' · Week ' + r.week + '</span>' +
          '<span style="font-size:11px;color:#666">' + r.date + '</span>' +
        '</div>' +
        '<div style="font-size:15px;font-weight:700;color:#f0f0ec;margin-top:2px">' + esc(r.name) + '</div>' +
        '<div style="font-size:11px;color:#777;margin-top:1px">' + esc(r.loc) + '</div>' +
        '<div style="font-size:12px;color:#999;margin-top:6px;font-style:italic;line-height:1.4">' + esc(r.goal) + '</div>' +
      '</div>' +
      '<div style="padding:12px 14px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:8px">' +
          '<span style="font-size:11px;color:#555">Prep checklist</span>' +
          '<span style="font-size:10px;color:' + (doneCount === r.prep.length ? "#22C55E" : "#444") + ';font-family:monospace">' + doneCount + '/' + r.prep.length + '</span>' +
        '</div>';
    r.prep.forEach(function(item, i){
      var done = getS("rp:" + r.week + ":" + i);
      html += '<div class="row" data-action="check-prep" data-key="rp:' + r.week + ':' + i + '">' +
        '<div class="chk" style="border:1.5px solid ' + (done ? r.color : "#353538") + ';background:' + (done ? r.color : "transparent") + '">' +
          (done ? '<span class="tick">✓</span>' : "") + '</div>' +
        '<span class="lbl" style="color:' + (done ? "#444" : "#8a8a92") + ';text-decoration:' + (done ? "line-through" : "none") + '">' + esc(item) + '</span>' +
      '</div>';
    });
    html += '</div></div>';
  });
  return html;
}

// ─── RENDER: OVERVIEW VIEW ──────────────────────────────────────────────────
function renderOverviewView() {
  var nextRace = RACES.find(function(r){ return r.week >= cur; });
  var curPhase = ph(cur);
  var wtr = nextRace ? (nextRace.week - cur) : null;

  var html = '<div style="padding:14px;border-radius:12px;background:' + curPhase.color + '10;border:1px solid ' + curPhase.color + '30;margin-bottom:16px">' +
    '<div style="font-size:10px;color:' + curPhase.color + ';font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-family:monospace;margin-bottom:3px">Now · Week ' + cur + ' of 20</div>' +
    '<div style="font-size:19px;font-weight:800;color:#f0f0ec">Phase ' + curPhase.id + ': ' + esc(curPhase.name) + '</div>' +
    '<div style="font-size:13px;color:#888;font-style:italic;margin-top:2px">' + esc(curPhase.tagline) + '</div>';
  if (nextRace) {
    html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid ' + curPhase.color + '20;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
      '<span style="font-size:11px;color:#555">Next:</span>' +
      '<span style="font-size:11px;font-weight:700;color:' + nextRace.color + '">' + esc(nextRace.name) + ' · ' + nextRace.date + '</span>' +
      '<span style="font-size:11px;color:#444">' + (wtr === 0 ? "← THIS WEEK" : (wtr + " week" + (wtr > 1 ? "s" : "") + " away")) + '</span>' +
    '</div>';
  }
  html += '</div>';

  html += '<div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:.12em;font-family:monospace;margin-bottom:10px">Program Arc</div>';
  PHASES.forEach(function(p){
    var isActive = p.weeks.indexOf(cur) !== -1;
    var isDone = Math.max.apply(null, p.weeks) < cur;
    var pRaces = RACES.filter(function(r){ return p.weeks.indexOf(r.week) !== -1; });
    html += '<div data-action="selweek" data-week="' + p.weeks[0] + '" style="padding:12px;border-radius:10px;background:' + (isActive ? "#1e1e22" : "#151517") + ';border:1px solid ' + (isActive ? p.color : "#222226") + ';margin-bottom:8px;cursor:pointer;opacity:' + (isDone ? ".55" : "1") + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div style="width:9px;height:9px;border-radius:2px;background:' + p.color + '"></div>' +
          '<span style="font-size:13px;font-weight:700;color:' + (isActive ? "#f0f0ec" : "#777") + '">Phase ' + p.id + ': ' + esc(p.name) + '</span>' +
          (isDone ? '<span style="font-size:9px;color:#22C55E;font-family:monospace">DONE</span>' : "") +
          (isActive ? '<span style="font-size:9px;color:' + p.color + ';font-family:monospace">← YOU ARE HERE</span>' : "") +
        '</div>' +
        '<span style="font-size:10px;color:#444;font-family:monospace">Wk ' + p.weeks[0] + '–' + p.weeks[p.weeks.length - 1] + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:#555;font-style:italic;margin-bottom:' + (pRaces.length ? "7px" : "0") + '">' + esc(p.tagline) + '</div>';
    pRaces.forEach(function(r){
      html += '<div style="display:flex;align-items:center;gap:6px">' +
        '<div style="width:5px;height:5px;border-radius:50%;background:' + r.color + '"></div>' +
        '<span style="font-size:11px;font-weight:700;color:' + r.color + '">' + r.type + ': ' + esc(r.name) + '</span>' +
        '<span style="font-size:11px;color:#444">· ' + r.date + '</span>' +
      '</div>';
    });
    html += '</div>';
  });

  html += '<div class="install-tip">' +
    '<div class="t">Offline app</div>' +
    '<p>This runs entirely on your phone — no signal needed on the trail. Your checkboxes save to this device. To keep an icon handy, add it to your home screen from Safari.</p>' +
  '</div>';
  return html;
}

// ─── RENDER DISPATCH ────────────────────────────────────────────────────────
function renderView() {
  var el = document.getElementById("view");
  var html;
  if (tab === "overview") html = renderOverviewView();
  else if (tab === "week") html = renderWeekView();
  else if (tab === "skills") html = renderSkillsView();
  else if (tab === "races") html = renderRacesView();
  el.innerHTML = html;
}

function renderAll() {
  renderTimeline();
  renderTabs();
  renderView();
}

// ─── EVENT DELEGATION ───────────────────────────────────────────────────────
document.addEventListener("click", function(e){
  var node = e.target;
  while (node && node !== document.body && !node.getAttribute("data-action")) {
    node = node.parentNode;
  }
  if (!node || node === document.body) return;
  var action = node.getAttribute("data-action");

  if (action === "tab") {
    tab = node.getAttribute("data-tab");
    renderTabs(); renderView();
  } else if (action === "selweek") {
    sel = parseInt(node.getAttribute("data-week"), 10);
    tab = "week";
    renderTimeline(); renderTabs(); renderView();
  } else if (action === "toggle-day") {
    var key = node.getAttribute("data-key");
    openDays[key] = !openDays[key];
    renderView();
  } else if (action === "check-day") {
    e.stopPropagation();
    var i = node.getAttribute("data-i");
    var k = "d:" + sel + ":" + i;
    setS(k, !getS(k));
    renderView();
  } else if (action === "check-skill" || action === "check-prep") {
    var sk = node.getAttribute("data-key");
    setS(sk, !getS(sk));
    renderView();
  }
});

// ─── SERVICE WORKER (offline copy onto the phone) ───────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}

// ─── INIT ───────────────────────────────────────────────────────────────────
renderAll();
</script>
