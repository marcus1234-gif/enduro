var sel = cur;
var tab = "home";
var openDays = {}; // key "week:index" -> bool

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ─── RENDER: TIMELINE ───────────────────────────────────────────────────────
function renderTimeline() {
  var cells = "";
  for (var w = 1; w <= TOTAL_WEEKS; w++) {
    var p = ph(w);
    var race = RACES.find(function(r){ return r.week === w; });
    var isSel = (w === sel), isCur = (w === cur);
    var border = isCur ? ("2px solid " + p.color) : isSel ? ("2px solid " + p.color) : ("1px solid " + p.color + "45");
    var bg = isSel ? p.color : (p.color + "28");
    var col = isSel ? "#fff" : p.color;
    cells +=
      '<div class="tl-cell" data-action="selweek" data-week="' + w + '">' +
        '<div class="tl-num" style="background:' + bg + ';border:' + border + ';color:' + col + '">' + w + '</div>' +
        '<div class="tl-dot" style="' + (race ? (race.optional ? ("border:1.5px solid " + race.color + ";background:transparent") : ("background:" + race.color)) : "background:transparent") + '"></div>' +
      '</div>';
  }
  var bands = "";
  PHASES.forEach(function(p){
    var n = p.weeks.length;
    var width = n * 26 + (n - 1) * 3;   // match week-cell widths + gaps so bands align
    var active = p.weeks.indexOf(cur) !== -1;
    bands +=
      '<div class="tl-band" data-action="selweek" data-week="' + p.weeks[0] + '" ' +
        'style="width:' + width + 'px;background:' + p.color + (active ? "33" : "1c") + ';border:1px solid ' + p.color + (active ? "" : "55") + ';color:' + (active ? "#f0f0ec" : p.color) + '">' +
        '<span>' + esc(p.name) + '</span>' +
      '</div>';
  });
  document.getElementById("timeline").innerHTML =
    '<div class="tl-row">' + cells + '</div><div class="tl-bandrow">' + bands + '</div>';
}

// ─── RENDER: TABS ───────────────────────────────────────────────────────────
function renderTabs() {
  var defs = [
    { id:"home", label:"Home" },
    { id:"week",     label:"Week " + sel },
    { id:"skills",   label:"Skills" },
    { id:"races",    label:"Races" },
    { id:"bike",     label:"Bike" },
  ];
  var html = "";
  defs.forEach(function(t){
    html += '<button class="tab' + (tab === t.id ? " active" : "") + '" data-action="tab" data-tab="' + t.id + '">' + esc(t.label) + '</button>';
  });
  document.getElementById("tabs").innerHTML = html;
}

// ─── RENDER: WEEK VIEW ──────────────────────────────────────────────────────
function dayCardHtml(w, di, day, checked) {
  var wt = WT[day.t] || WT.rest;
  var isEvent = (day.t === "race" || day.t === "watch");
  var open = !!openDays[w + ":" + di];
  var checkbox = "";
  if (!isEvent) {
    checkbox =
      '<div class="dc-check" data-action="check-day" data-i="' + di + '" ' +
      'style="border:1.5px solid ' + (checked ? wt.border : "#3a3a3d") + ';background:' + (checked ? wt.border : "transparent") + '">' +
      (checked ? '<span class="tick" style="font-size:10px">✓</span>' : "") + '</div>';
  }
  var titleStyle = "color:" + (checked ? "#555" : "#d4d4dc") + ";text-decoration:" + (checked ? "line-through" : "none");
  var body = "";
  if (open) {
    var lis = "";
    day.b.forEach(function(item){
      lis += '<li class="dc-li"><span style="color:' + wt.border + ';flex-shrink:0">›</span>' + esc(item) + '</li>';
    });
    var note = day.n
      ? '<div class="dc-note" style="background:' + wt.bg + ';border-left:2px solid ' + wt.border + '"><p>' + esc(day.n) + '</p></div>'
      : "";
    body = '<div class="dc-body"><ul class="dc-list">' + lis + '</ul>' + note + '</div>';
  }
  return '<div class="daycard" style="border-color:' + (open ? wt.border : "#242428") + '">' +
    '<div class="dc-head" data-action="toggle-day" data-key="' + w + ':' + di + '">' +
      checkbox +
      '<span class="dc-dayname">' + DAYS[di] + '</span>' +
      '<span class="dc-badge" style="color:' + wt.border + ';background:' + wt.bg + '">' + wt.badge + '</span>' +
      '<span class="dc-title" style="' + titleStyle + '">' + esc(day.h) + '</span>' +
      '<span class="dc-caret">' + (open ? "▲" : "▼") + '</span>' +
    '</div>' + body + '</div>';
}

function renderWeekView() {
  var phase = ph(sel);
  var race = RACES.find(function(r){ return r.week === sel; });
  var days = [];
  for (var i = 0; i < 7; i++) days.push(getDay(sel, i));
  function checked(i){ return getS("d:" + sel + ":" + i); }
  var trainDays = days.filter(function(d){ return d.t !== "race" && d.t !== "watch"; }).length;
  var doneCount = 0;
  for (var j = 0; j < 7; j++) if (checked(j)) doneCount++;
  var pct = trainDays ? (doneCount / trainDays * 100) : 0;

  var html = "";
  html += '<div style="margin-bottom:14px">' +
    '<div style="font-size:10px;font-weight:700;color:' + phase.color + ';text-transform:uppercase;letter-spacing:.12em;font-family:monospace;margin-bottom:3px">Week ' + sel + ' · Phase ' + phase.id + ': ' + esc(phase.name) + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<span style="font-size:12px;color:#555">' + WK_DATES[sel - 1] + '</span>' +
      '<span style="font-size:11px;color:' + (doneCount === trainDays ? "#22C55E" : "#555") + ';font-family:monospace">' + doneCount + '/' + trainDays + ' done</span>' +
    '</div>' +
    '<div style="height:3px;background:#242428;border-radius:2px;margin-top:6px">' +
      '<div style="height:100%;width:' + pct + '%;background:' + phase.color + ';border-radius:2px;transition:width .3s"></div>' +
    '</div></div>';

  if (race) {
    html += '<div style="padding:10px 12px;border-radius:8px;background:' + race.color + '14;border:1px solid ' + race.color + '45;margin-bottom:12px">' +
      '<span style="font-size:10px;font-weight:700;color:' + race.color + ';letter-spacing:.1em">' + race.type + (race.optional ? " · OPTIONAL" : "") + ' · THIS WEEK</span>' +
      '<p style="margin:2px 0 0;font-size:13px;color:#d4d4dc;font-weight:600">' + esc(race.name) + ' · ' + race.date + '</p>' +
      '<p style="margin:2px 0 0;font-size:11px;color:#888">' + esc(race.loc) + ' · ' + esc(race.goal) + '</p>' +
    '</div>';
  }
  for (var k = 0; k < 7; k++) html += dayCardHtml(sel, k, days[k], checked(k));
  return html;
}

// ─── RENDER: SKILLS VIEW ────────────────────────────────────────────────────
function renderSkillsView() {
  var html = "";

  // ── Goals banner: the trajectory ──
  function milestone(yr, yrColor, h, d) {
    return '<div class="ms">' +
      '<span class="yr" style="background:' + yrColor + '">' + yr + '</span>' +
      '<div><div class="h">' + h + '</div><div class="d">' + d + '</div></div>' +
    '</div>';
  }
  html += '<div class="goals">' +
    '<div class="goals-t">THE TRAJECTORY</div>' +
    milestone("2026", "#F04E00", "C class hare scrambles — mid-pack", "This program. Preston → Baker City → Tamarack.") +
    milestone("2027", "#3B82F6", "Silver Kings — Bronze course, B class", "Step up to a Hard Enduro World Championship round in Kellogg.") +
    milestone("SOMEDAY", "#EF4444", "Red Bull Erzbergrodeo, Austria", "The hardest hard enduro on earth. The north star.") +
  '</div>';

  // ── Technical Skills Ladder ──
  var ladDone = 0, ladTotal = 0;
  LADDER.forEach(function(t, ti){ t.items.forEach(function(_, i){ ladTotal++; if (getS("lad:" + ti + ":" + i)) ladDone++; }); });
  var ladPct = ladTotal ? Math.round(ladDone / ladTotal * 100) : 0;

  html += '<div class="sec-label">Technical Skills Ladder</div>';
  html += '<p style="font-size:12px;color:#555;margin:-4px 0 12px;line-height:1.5">The full progression, fundamentals to Erzberg-grade. Each tier builds on the one below — get solid on a tier before you lean on the next.</p>';
  html += '<div class="catrow"><div class="top">' +
      '<div class="nm"><span style="font-size:12px;font-weight:700;color:#c4c4cc">Overall ladder</span></div>' +
      '<span class="ct">' + ladDone + '/' + ladTotal + ' · ' + ladPct + '%</span>' +
    '</div><div class="bar"><div data-width="' + ladPct + '" style="background:linear-gradient(90deg,#22C55E,#3B82F6,#F59E0B,#EF4444)"></div></div></div>';
  html += '<div style="height:6px"></div>';

  LADDER.forEach(function(t, ti){
    var done = t.items.filter(function(_, i){ return getS("lad:" + ti + ":" + i); }).length;
    var allDoneTier = done === t.items.length;
    var prevComplete = ti === 0 || LADDER[ti - 1].items.every(function(_, i){ return getS("lad:" + (ti - 1) + ":" + i); });
    var locked = !prevComplete && !allDoneTier;
    html += '<div class="tier-card" style="border:1px solid ' + t.color + (locked ? "22" : "55") + ';opacity:' + (locked ? ".62" : "1") + '">' +
      '<div class="tier-head">' +
        '<div class="tier-name" style="color:' + (locked ? "#8a8a92" : "#f0f0ec") + '">' +
          '<span class="tier-num" style="color:' + t.color + ';background:' + t.color + '1f">TIER ' + (ti + 1) + '</span>' +
          esc(t.tier) + (allDoneTier ? ' <span style="font-size:10px;color:#22C55E;font-family:monospace">✓ DIALED</span>' : '') +
        '</div>' +
        '<span style="font-size:10px;color:' + (allDoneTier ? "#22C55E" : "#555") + ';font-family:monospace">' + done + '/' + t.items.length + '</span>' +
      '</div>';
    if (locked) html += '<div class="lock">🔒 Build Tier ' + ti + ' first — but tap anything you\'ve already got</div>';
    t.items.forEach(function(item, i){
      var dn = getS("lad:" + ti + ":" + i);
      html += '<div class="row" data-action="check-skill" data-key="lad:' + ti + ':' + i + '">' +
        '<div class="chk" style="border:1.5px solid ' + (dn ? t.color : "#353538") + ';background:' + (dn ? t.color : "transparent") + '">' +
          (dn ? '<span class="tick">✓</span>' : "") + '</div>' +
        '<span class="lbl" style="color:' + (dn ? "#444" : "#8a8a92") + ';text-decoration:' + (dn ? "line-through" : "none") + '">' + esc(item) + '</span>' +
      '</div>';
    });
    html += '<div class="tier-note" style="background:' + t.color + '12;border-left:2px solid ' + t.color + '">' + esc(t.note) + '</div>';
    html += '</div>';
  });

  // ── Race-specific skills (this season) ──
  html += '<div class="sec-label" style="margin-top:20px">Race-Specific Skills · This Season</div>';
  html += '<p style="font-size:12px;color:#555;margin:-4px 0 12px;line-height:1.5">Phase-by-phase skills tied to your 2026 program. Work through each phase in order.</p>';
  SKILLS.forEach(function(cat, ci){
    var p = PHASES[cat.phase - 1];
    var doneCount = cat.items.filter(function(_, i){ return getS("sk:" + ci + ":" + i); }).length;
    html += '<div style="margin-bottom:12px;padding:12px;border-radius:10px;background:#1a1a1d;border:1px solid #252528">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
        '<div style="display:flex;align-items:center;gap:7px">' +
          '<div style="width:8px;height:8px;border-radius:2px;background:' + p.color + '"></div>' +
          '<span style="font-size:12px;font-weight:700;color:#d4d4dc">' + esc(cat.cat) + '</span>' +
          '<span style="font-size:9px;color:' + p.color + ';font-family:monospace">Phase ' + cat.phase + '</span>' +
        '</div>' +
        '<span style="font-size:10px;color:' + (doneCount === cat.items.length ? "#22C55E" : "#444") + ';font-family:monospace">' + doneCount + '/' + cat.items.length + '</span>' +
      '</div>';
    cat.items.forEach(function(skill, i){
      var done = getS("sk:" + ci + ":" + i);
      html += '<div class="row" data-action="check-skill" data-key="sk:' + ci + ':' + i + '">' +
        '<div class="chk" style="border:1.5px solid ' + (done ? p.color : "#353538") + ';background:' + (done ? p.color : "transparent") + '">' +
          (done ? '<span class="tick">✓</span>' : "") + '</div>' +
        '<span class="lbl" style="color:' + (done ? "#444" : "#8a8a92") + ';text-decoration:' + (done ? "line-through" : "none") + '">' + esc(skill) + '</span>' +
      '</div>';
    });
    html += '</div>';
  });
  return html;
}

// ─── RENDER: RACES VIEW ─────────────────────────────────────────────────────
function renderRacesView() {
  var html = "";
  RACES.forEach(function(r){
    var doneCount = r.prep.filter(function(_, i){ return getS("rp:" + r.week + ":" + i); }).length;
    var tag = r.optional
      ? '<span style="font-size:8px;font-weight:700;color:#888;background:#2a2a2e;border:1px dashed #555;border-radius:4px;padding:1px 5px;letter-spacing:.08em">OPTIONAL</span>'
      : '<span style="font-size:8px;font-weight:700;color:' + r.color + ';background:' + r.color + '1f;border-radius:4px;padding:1px 5px;letter-spacing:.08em">CORE</span>';
    var brd = r.optional ? ("1px dashed " + r.color + "55") : ("1px solid " + r.color + "35");
    html += '<div style="margin-bottom:14px;border-radius:12px;background:#1a1a1d;border:' + brd + ';overflow:hidden;opacity:' + (r.optional ? ".92" : "1") + '">' +
      '<div style="padding:12px 14px;background:' + r.color + (r.optional ? "08" : "10") + ';border-bottom:1px solid ' + r.color + '25">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-size:10px;font-weight:700;color:' + r.color + ';letter-spacing:.1em;font-family:monospace">' + r.type + ' · Week ' + r.week + '</span>' +
          '<span style="font-size:11px;color:#666">' + r.date + '</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:7px;margin-top:3px">' +
          '<span style="font-size:15px;font-weight:700;color:#f0f0ec">' + esc(r.name) + '</span>' + tag +
        '</div>' +
        '<div style="font-size:11px;color:#777;margin-top:2px">' + esc(r.loc) + '</div>' +
        '<div style="font-size:12px;color:#999;margin-top:6px;font-style:italic;line-height:1.4">' + esc(r.goal) + '</div>' +
      '</div>' +
      '<div style="padding:12px 14px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:8px">' +
          '<span style="font-size:11px;color:#555">Prep checklist</span>' +
          '<span style="font-size:10px;color:' + (doneCount === r.prep.length ? "#22C55E" : "#444") + ';font-family:monospace">' + doneCount + '/' + r.prep.length + '</span>' +
        '</div>';
    r.prep.forEach(function(item, i){
      var done = getS("rp:" + r.week + ":" + i);
      html += '<div class="row" data-action="check-prep" data-key="rp:' + r.week + ':' + i + '">' +
        '<div class="chk" style="border:1.5px solid ' + (done ? r.color : "#353538") + ';background:' + (done ? r.color : "transparent") + '">' +
          (done ? '<span class="tick">✓</span>' : "") + '</div>' +
        '<span class="lbl" style="color:' + (done ? "#444" : "#8a8a92") + ';text-decoration:' + (done ? "line-through" : "none") + '">' + esc(item) + '</span>' +
      '</div>';
    });
    html += '</div></div>';
  });
  return html;
}

// ─── RENDER: BIKE VIEW ──────────────────────────────────────────────────────
function renderBikeView() {
  var html = "";
  // Quick-reference specs
  html += '<div style="margin-bottom:16px;padding:12px 14px;border-radius:12px;background:#161619;border:1px solid #242428">';
  html += '<div style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#555;font-family:monospace;margin-bottom:9px">FLUIDS &amp; WEAR PARTS</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:11px;font-family:monospace">';
  var specs = [["Premix","50:1 Motul 800"],["Trans","800ml Transoil"],["Coolant","Engine Ice"],["Brake","RBF 600 DOT4"],["Plug","NGK GR7CI8 ×2"],["Chain","Regina 520 ZSE"],["Rear spkt","49T"],["Rear sag","105mm"]];
  specs.forEach(function(s){ html += '<div style="display:flex;justify-content:space-between;border-bottom:1px dotted #242428;padding:2px 0"><span style="color:#666">'+s[0]+'</span><span style="color:#c4c4cc">'+esc(s[1])+'</span></div>'; });
  html += '</div></div>';

  MAINT.forEach(function(sec){
    var total = sec.items.length, done = 0;
    sec.items.forEach(function(_, i){ if (getS("mt:"+sec.id+":"+i)) done++; });
    html += '<div style="margin-bottom:14px;border-radius:12px;background:#1a1a1d;border:1px solid '+sec.color+'35;overflow:hidden">';
    html += '<div style="padding:10px 14px;background:'+sec.color+'12;border-bottom:1px solid '+sec.color+'25;display:flex;justify-content:space-between;align-items:flex-start">';
    html += '<div><span style="font-size:11px;font-weight:800;color:'+sec.color+';letter-spacing:.08em;font-family:monospace">'+esc(sec.badge)+'</span>';
    html += '<div style="font-size:11px;color:#777;margin-top:3px;font-style:italic;line-height:1.4">'+esc(sec.cadence)+'</div></div>';
    html += '<span style="font-size:10px;color:'+(done===total?"#22C55E":"#444")+';font-family:monospace;flex-shrink:0;margin-left:8px">'+done+'/'+total+'</span>';
    html += '</div><div style="padding:12px 14px 4px">';
    sec.items.forEach(function(it, i){
      var k = "mt:"+sec.id+":"+i, d = getS(k);
      html += '<div style="margin-bottom:13px">';
      html += '<div class="row" data-action="check-maint" data-key="'+k+'" style="margin-bottom:4px">';
      html += '<div class="chk" style="border:1.5px solid '+(d?sec.color:"#353538")+';background:'+(d?sec.color:"transparent")+'">'+(d?'<span class="tick">✓</span>':"")+'</div>';
      html += '<span class="lbl" style="font-weight:700;color:'+(d?"#555":"#e4e4e8")+';text-decoration:'+(d?"line-through":"none")+'">'+esc(it.n)+'</span>';
      html += '</div>';
      html += '<div style="font-size:11px;color:#8a8a92;line-height:1.45;padding-left:23px">'+esc(it.look)+'</div>';
      if (it.flag) html += '<div style="margin:6px 0 0 23px;padding:5px 9px;border-radius:0 5px 5px 0;background:rgba(239,68,68,.1);border-left:2px solid #EF4444"><span style="font-size:9px;font-weight:700;color:#EF4444;font-family:monospace;letter-spacing:.1em">RED FLAG</span> <span style="font-size:11px;color:#d0a89e;line-height:1.4">'+esc(it.flag)+'</span></div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  html += '<div style="margin-top:4px;padding:10px 12px;border-radius:8px;background:rgba(240,78,0,.06);border:1px solid rgba(240,78,0,.2)"><p style="margin:0;font-size:11px;color:#9a9aa2;line-height:1.5">Intervals are hard-trail figures, doubled from the race-pace baseline. The inspection signals gate the schedule — clean gearbox oil and a tan plug earn the longer interval; bad signs shorten it. Tighten back toward 5h service once you\'re truly racing. Confirm torque and clearance specs against the Beta 250/300 RR-Race service manual.</p></div>';
  return html;
}


// ─── RENDER: OVERVIEW VIEW ──────────────────────────────────────────────────
// ─── PROGRESS STATS ─────────────────────────────────────────────────────────
function computeStats() {
  var cats = {
    mob:  { label:"Mobility",  color:"#6366F1", done:0, total:0 },
    str:  { label:"Strength",  color:"#3B82F6", done:0, total:0 },
    z2:   { label:"Zone 2",    color:"#10B981", done:0, total:0 },
    hiit: { label:"HIIT",      color:"#F59E0B", done:0, total:0 },
    ride: { label:"Riding",    color:"#F04E00", done:0, total:0 },
    rec:  { label:"Recovery",  color:"#6B7280", done:0, total:0 },
  };
  function bucket(t){ return t === "rest" ? "rec" : t; }
  var trainDone = 0, trainTotal = 0;
  for (var w = 1; w <= TOTAL_WEEKS; w++) {
    for (var d = 0; d < 7; d++) {
      var day = getDay(w, d);
      if (day.t === "race" || day.t === "watch") continue; // no checkbox on event days
      var b = bucket(day.t);
      if (!cats[b]) continue;
      cats[b].total++; trainTotal++;
      if (getS("d:" + w + ":" + d)) { cats[b].done++; trainDone++; }
    }
  }
  var skDone = 0, skTotal = 0;
  SKILLS.forEach(function(cat, ci){ cat.items.forEach(function(_, i){ skTotal++; if (getS("sk:" + ci + ":" + i)) skDone++; }); });
  var rpDone = 0, rpTotal = 0;
  RACES.forEach(function(r){ r.prep.forEach(function(_, i){ rpTotal++; if (getS("rp:" + r.week + ":" + i)) rpDone++; }); });
  return {
    cats: cats, order: ["mob","str","z2","hiit","ride","rec"],
    trainDone: trainDone, trainTotal: trainTotal,
    skDone: skDone, skTotal: skTotal,
    rpDone: rpDone, rpTotal: rpTotal,
    allDone: trainDone + skDone + rpDone,
    allTotal: trainTotal + skTotal + rpTotal,
  };
}
function pctOf(d, t){ return t ? Math.round(d / t * 100) : 0; }

function ringSvg(pct, color) {
  var r = 60, C = 2 * Math.PI * r;
  var off = C - (pct / 100) * C;
  return '<svg width="138" height="138" viewBox="0 0 132 132">' +
    '<circle cx="66" cy="66" r="60" fill="none" stroke="#242428" stroke-width="12"/>' +
    '<circle class="ring-fg" cx="66" cy="66" r="60" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" style="stroke-dashoffset:' + C.toFixed(1) + '" data-offset="' + off.toFixed(1) + '" transform="rotate(-90 66 66)"/>' +
    '<text x="66" y="61" text-anchor="middle" font-size="32" font-weight="800" fill="#f0f0ec" font-family="system-ui,sans-serif">' + pct + '%</text>' +
    '<text x="66" y="82" text-anchor="middle" font-size="10" fill="#666" font-family="monospace" letter-spacing="1">OVERALL</text>' +
  '</svg>';
}

function headline(pct) {
  if (pct >= 100) return "Every box checked. Go ride.";
  if (pct >= 80)  return "Final push — stay smooth.";
  if (pct >= 60)  return "Tamarack's coming into view.";
  if (pct >= 40)  return "Deep in the build now.";
  if (pct >= 20)  return "Momentum's building.";
  if (pct >= 1)   return "The base is forming.";
  return "Time to put in the work.";
}

function renderHomeView() {
  var nextRace = RACES.find(function(r){ return r.week >= cur; });
  var curPhase = ph(cur);
  var wtr = nextRace ? (nextRace.week - cur) : null;
  var s = computeStats();
  var allPct = pctOf(s.allDone, s.allTotal);
  var weeksToSK = Math.max(GOAL_WEEK - cur, 0);
  var journeyPct = Math.round(Math.min(cur, GOAL_WEEK) / GOAL_WEEK * 100);
  var ladDone = 0, ladTotal = 0;
  LADDER.forEach(function(t, ti){ t.items.forEach(function(_, i){ ladTotal++; if (getS("lad:" + ti + ":" + i)) ladDone++; }); });

  // Hero card with overall ring
  var html = '<div class="hero">' +
    '<div class="hl">' + headline(allPct) + '</div>' +
    '<div class="hl-sub">WEEK ' + cur + ' OF ' + TOTAL_WEEKS + ' · PHASE ' + curPhase.id + ': ' + esc(curPhase.name).toUpperCase() +
      (weeksToSK > 0 ? ' · ' + weeksToSK + ' TO SILVER KINGS' : ' · RACE WEEK') + '</div>' +
    '<div class="ringwrap">' + ringSvg(allPct, curPhase.color) + '</div>' +
    '<div class="pills">' +
      '<span class="pill"><span class="pd" style="background:#F04E00"></span>Training <b>' + pctOf(s.trainDone, s.trainTotal) + '%</b></span>' +
      '<span class="pill"><span class="pd" style="background:#8B5CF6"></span>Skills <b>' + pctOf(s.skDone, s.skTotal) + '%</b></span>' +
      '<span class="pill"><span class="pd" style="background:#22C55E"></span>Race prep <b>' + pctOf(s.rpDone, s.rpTotal) + '%</b></span>' +
      '<span class="pill"><span class="pd" style="background:#EF4444"></span>Ladder <b>' + pctOf(ladDone, ladTotal) + '%</b></span>' +
    '</div>' +
    '<div class="count-line">' + s.allDone + ' of ' + s.allTotal + ' items complete</div>' +
    '<div style="margin-top:14px">' +
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:#555;font-family:monospace;margin-bottom:5px"><span>ROAD TO SILVER KINGS</span><span>' + journeyPct + '%</span></div>' +
      '<div class="bar" style="height:8px"><div data-width="' + journeyPct + '" style="background:linear-gradient(90deg,#3B82F6,#22C55E,#38BDF8,#84CC16,#D97706)"></div></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:#3a3a3e;font-family:monospace;margin-top:3px"><span>Jun 2026</span><span>Jun 2027</span></div>' +
    '</div>';
  if (nextRace) {
    html += '<div class="nextchip">' +
      '<span style="font-size:11px;color:#555">Next:</span>' +
      '<span style="font-size:11px;font-weight:700;color:' + nextRace.color + '">' + esc(nextRace.name) + (nextRace.optional ? " (optional)" : "") + ' · ' + nextRace.date + '</span>' +
      '<span style="font-size:11px;color:#444">' + (wtr === 0 ? "← THIS WEEK" : (wtr + " week" + (wtr > 1 ? "s" : "") + " away")) + '</span>' +
    '</div>';
  }
  html += '</div>';

  // Category breakdown
  html += '<div class="sec-label">Training by category</div>';
  s.order.forEach(function(key){
    var c = s.cats[key];
    if (!c.total) return;
    var p = pctOf(c.done, c.total);
    html += '<div class="catrow">' +
      '<div class="top">' +
        '<div class="nm"><span class="cd" style="background:' + c.color + '"></span>' + c.label +
          '<span style="font-size:10px;color:' + c.color + ';font-family:monospace;font-weight:700">' + p + '%</span></div>' +
        '<span class="ct">' + c.done + '/' + c.total + '</span>' +
      '</div>' +
      '<div class="bar"><div data-width="' + p + '" style="background:' + c.color + '"></div></div>' +
    '</div>';
  });

  html += '<div class="sec-label" style="margin-top:18px">Program Arc</div>';
  PHASES.forEach(function(p){
    var isActive = p.weeks.indexOf(cur) !== -1;
    var isDone = Math.max.apply(null, p.weeks) < cur;
    var pRaces = RACES.filter(function(r){ return p.weeks.indexOf(r.week) !== -1; });
    html += '<div data-action="selweek" data-week="' + p.weeks[0] + '" style="padding:12px;border-radius:10px;background:' + (isActive ? "#1e1e22" : "#151517") + ';border:1px solid ' + (isActive ? p.color : "#222226") + ';margin-bottom:8px;cursor:pointer;opacity:' + (isDone ? ".55" : "1") + '">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div style="width:9px;height:9px;border-radius:2px;background:' + p.color + '"></div>' +
          '<span style="font-size:13px;font-weight:700;color:' + (isActive ? "#f0f0ec" : "#777") + '">Phase ' + p.id + ': ' + esc(p.name) + '</span>' +
          (isDone ? '<span style="font-size:9px;color:#22C55E;font-family:monospace">DONE</span>' : "") +
          (isActive ? '<span style="font-size:9px;color:' + p.color + ';font-family:monospace">← YOU ARE HERE</span>' : "") +
        '</div>' +
        '<span style="font-size:10px;color:#444;font-family:monospace">Wk ' + p.weeks[0] + '–' + p.weeks[p.weeks.length - 1] + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:#555;font-style:italic;margin-bottom:' + (pRaces.length ? "7px" : "0") + '">' + esc(p.tagline) + '</div>';
    pRaces.forEach(function(r){
      html += '<div style="display:flex;align-items:center;gap:6px">' +
        '<div style="width:5px;height:5px;border-radius:50%;background:' + r.color + '"></div>' +
        '<span style="font-size:11px;font-weight:700;color:' + r.color + '">' + r.type + ': ' + esc(r.name) + '</span>' +
        '<span style="font-size:11px;color:#444">· ' + r.date + '</span>' +
      '</div>';
    });
    html += '</div>';
  });

  html += '<div class="install-tip">' +
    '<div class="t">Offline app</div>' +
    '<p>This runs entirely on your phone — no signal needed on the trail. Your checkboxes save to this device. To keep an icon handy, add it to your home screen from Safari.</p>' +
  '</div>';
  return html;
}

// ─── RENDER DISPATCH ────────────────────────────────────────────────────────
function renderView() {
  var el = document.getElementById("view");
  var html;
  if (tab === "home") html = renderHomeView();
  else if (tab === "week") html = renderWeekView();
  else if (tab === "skills") html = renderSkillsView();
  else if (tab === "races") html = renderRacesView();
  else if (tab === "bike") html = renderBikeView();
  el.innerHTML = html;
  animate();
}

function animate() {
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var el = document.getElementById("view");
    if (!el) return;
    el.querySelectorAll(".ring-fg").forEach(function(c){
      c.style.strokeDashoffset = c.getAttribute("data-offset");
    });
    el.querySelectorAll(".bar > div[data-width]").forEach(function(b){
      b.style.width = b.getAttribute("data-width") + "%";
    });
  }); });
}

function renderAll() {
  renderTimeline();
  renderTabs();
  renderView();
}

// ─── EVENT DELEGATION ───────────────────────────────────────────────────────
document.addEventListener("click", function(e){
  var node = e.target;
  while (node && node !== document.body && !node.getAttribute("data-action")) {
    node = node.parentNode;
  }
  if (!node || node === document.body) return;
  var action = node.getAttribute("data-action");

  if (action === "tab") {
    tab = node.getAttribute("data-tab");
    renderTabs(); renderView();
  } else if (action === "selweek") {
    sel = parseInt(node.getAttribute("data-week"), 10);
    tab = "week";
    renderTimeline(); renderTabs(); renderView();
  } else if (action === "toggle-day") {
    var key = node.getAttribute("data-key");
    openDays[key] = !openDays[key];
    renderView();
  } else if (action === "check-day") {
    e.stopPropagation();
    var i = node.getAttribute("data-i");
    var k = "d:" + sel + ":" + i;
    setS(k, !getS(k));
    renderView();
  } else if (action === "check-skill" || action === "check-prep" || action === "check-maint") {
    var sk = node.getAttribute("data-key");
    setS(sk, !getS(sk));
    renderView();
  }
});

// ─── SERVICE WORKER (offline copy onto the phone) ───────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}

// ─── INIT ───────────────────────────────────────────────────────────────────
renderAll();
</script>
